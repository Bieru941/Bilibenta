name: bilibenta
description: BiliBenta - Buy Smart, Sell Fast. Local Filipino marketplace for new and secondhand products.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Supabase
  supabase_flutter: ^1.10.0
  
  # State Management
  provider: ^6.0.0
  
  # HTTP & Networking
  http: ^1.1.0
  
  # Firebase (Push Notifications)
  firebase_core: ^2.19.0
  firebase_messaging: ^14.6.0
  
  # Image & File Handling
  image_picker: ^1.0.0
  cached_network_image: ^3.3.0
  image_compression_flutter: ^1.0.0
  
  # Local Storage
  shared_preferences: ^2.2.0
  sqflite: ^2.3.0
  path_provider: ^2.1.0
  
  # UI Components
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.0
  intl: ^0.19.0
  timeago: ^3.5.0
  
  # Authentication
  google_sign_in: ^6.1.0
  flutter_facebook_auth: ^4.4.0
  
  # Notifications
  flutter_local_notifications: ^14.1.0
  
  # Maps & Location
  geolocator: ^9.0.0
  
  # Payment (Future Integration)
  flutter_stripe: ^10.1.0
  
  # Analytics
  firebase_analytics: ^10.4.0
  
  # Utilities
  uuid: ^4.0.0
  dio: ^5.3.0
  connectivity_plus: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700